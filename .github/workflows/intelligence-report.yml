name: Intelligence Report

on:
  schedule:
    # 09:00 BRT = 12:00 UTC, depois do check de voos das 08:00 BRT.
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  generate:
    name: Generate intelligence report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate intelligence report
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run intelligence

      - name: Add report to job summary
        run: cat reports/daily-intelligence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-intelligence-report
          path: |
            reports/daily-intelligence.md
            reports/daily-intelligence.json
          retention-days: 30
