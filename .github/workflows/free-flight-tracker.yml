name: Free flight tracker

on:
  workflow_dispatch:
  schedule:
    # GitHub agenda em UTC; duas consultas diárias, com baixa frequência.
    - cron: "17 11 * * *"
    - cron: "17 23 * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free scraper
        run: pip install -r requirements-free.txt
      - name: Search flights and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FLIGHT_ORIGINS: ${{ vars.FLIGHT_ORIGINS || 'GRU,VCP' }}
          FLIGHT_ARRIVAL_AIRPORTS: ${{ vars.FLIGHT_ARRIVAL_AIRPORTS || 'MRS,NCE,LYS,BCN,MAD,LIS,OPO' }}
          FLIGHT_RETURN_AIRPORTS: ${{ vars.FLIGHT_RETURN_AIRPORTS || 'MRS,NCE,LYS,BCN,MAD,LIS,OPO' }}
          FLIGHT_MAX_PRICE_BRL: ${{ vars.FLIGHT_MAX_PRICE_BRL || '6000' }}
          FLIGHT_SEND_SUMMARY: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python scripts/free_flight_tracker.py
      - name: Save price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/*.json é ignorado pelo projeto legado; este histórico é
          # intencionalmente persistido para o tracker gratuito.
          git add -f data/free-flight-history.json
          git diff --cached --quiet || git commit -m "chore: update free flight price history"
          git push
