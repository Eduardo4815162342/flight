name: Personalized Radar

on:
  workflow_dispatch: # mantido apenas para execução manual

jobs:
  send:
    name: Send personalized radar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Send personalized radar
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_API_TOKEN_1: ${{ secrets.APIFY_API_TOKEN_1 }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          DESTINATIONS: ${{ vars.DESTINATIONS }}
          PRICE_ERROR_THRESHOLD: ${{ vars.PRICE_ERROR_THRESHOLD }}
        run: npm run radar
